/*
 * :phonehub-companion — telefona kurulan Phone Hub istemcisi (GÖREV 2).
 *
 * ── NEDEN AYRI UYGULAMA MODÜLÜ ──────────────────────────────────────────────
 * CAROS head unit uygulaması ile companion AYRI cihazlarda çalışır ve ayrı
 * APK olmak ZORUNDADIR. Ayrı modül olmasının ikinci faydası: `:app` bu turda
 * hiç değişmez (yalnız tek satır bağımlılık + tek satır plugin kaydı aldı),
 * dolayısıyla mevcut launcher davranışına regresyon riski yoktur.
 *
 * ── CAPACITOR YOK, WEBVIEW YOK ──────────────────────────────────────────────
 * Companion saf Android'dir. WebView taşımak hem gereksiz hem de bağlantı
 * güvenilirliğini WebView yaşam döngüsüne bağlardı; bağlantı arka planda,
 * ekran kapalıyken de yaşamalıdır.
 */
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.cockpitos.phonehub.companion"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.cockpitos.phonehub.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    // Head unit ile PAYLAŞILAN protokol — iki uç aynı kodu konuşur.
    implementation project(':phonehub-protocol')

    testImplementation "junit:junit:$junitVersion"
}
