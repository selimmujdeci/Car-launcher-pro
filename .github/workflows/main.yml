# ─────────────────────────────────────────────────────────────────────────────
# Caros Pro CI — Automotive Grade Quality Gate
#
# CLAUDE.md §Automotive Grade Engineering Standards — Zero-Defect Deployment
#
# Triggers : push → main, dev  |  pull_request → main, dev
# Jobs     : lint-typecheck → test → build  (serial fail-fast)
#            android_unit_tests                (PARALEL — ayrı dil zinciri)
#
# Automotive Critical Tests (must pass):
#   src/__tests__/geofence.test.ts
#   src/__tests__/obdService.test.ts
#   android .../can/McuCommandWhitelistTest.java     ← fiziksel komut whitelist'i
#   android .../obd/ElmProtocolTest.java             ← OBD protokol seçimi
#   android .../BootReceiverActionGateTest.java      ← boot action kapısı
#   android .../protocol/SessionCryptoTest.java      ← Phone Hub oturum kriptosu
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-flight runs for the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Placeholder values — vitest mocks supabase; only real builds need live creds
  VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL      || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
  VITE_DISABLE_OBD_MOCK:  'false'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Lint & Type-Check
#   Fast static analysis gate. Must pass before test or build can run.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint_typecheck:
    name: Lint & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm            # caches ~/.npm keyed on package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: ESLint
        run: npm run lint

      - name: TypeScript — composite build check
        # tsc -b honours tsconfig.json references (app + node)
        # Fails on any type error — same gate as `npm run build`
        run: npx tsc -b --noEmit

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Unit Tests (Vitest / jsdom)
#   Automotive Critical: geofence.test.ts + obdService.test.ts must be green.
#   Runs only after lint_typecheck succeeds (fail-fast).
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    needs: lint_typecheck
    runs-on: ubuntu-latest

    permissions:
      checks: write          # required by test-reporter to post Check annotations
      pull-requests: write   # required to post PR comments with test summary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Create reports directory
        run: mkdir -p reports

      - name: Vitest — full suite
        # --reporter=default   → human-readable terminal output
        # --reporter=junit     → machine-readable XML for test-reporter action
        # --outputFile.junit   → path for the JUnit reporter only
        # --passWithNoTests=false → CI fails if test discovery finds 0 tests
        run: |
          npx vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=reports/junit.xml \
            --passWithNoTests=false
        env:
          CI: true

      - name: Verify automotive-critical tests ran
        # Ensure the two safety-critical test files were discovered and reported.
        # If vitest skips/misses them the XML will lack their suite entries.
        if: always()
        shell: bash
        run: |
          # vitest junit classname = tam dosya yolu (ör. classname="src/__tests__/geofence.test.ts")
          # → suite adını yol önekinden sonra ara ("baştan" değil, "içerir").
          for suite in "geofence" "obdService"; do
            if ! grep -q "classname=\"[^\"]*${suite}" reports/junit.xml 2>/dev/null; then
              echo "::error::Automotive critical test suite '${suite}' not found in JUnit report. Build blocked."
              exit 1
            fi
          done
          echo "✓ Automotive critical suites confirmed: geofence, obdService"

      - name: Publish test results
        # Posts inline annotations and a summary table to the PR / commit check.
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name:              Unit Test Results
          path:              reports/junit.xml
          reporter:          java-junit
          fail-on-error:     true
          fail-on-empty:     true

      - name: Upload JUnit artifact
        if: always()           # preserve report even on failure for post-mortem
        uses: actions/upload-artifact@v4
        with:
          name:            test-results-${{ github.run_number }}
          path:            reports/junit.xml
          retention-days:  30

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Production Build
#   Verifies `tsc -b && vite build` completes without error.
#   Runs only after both lint_typecheck AND test pass.
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    needs: [lint_typecheck, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Cache Vite/Rolldown transform cache between builds on the same branch
      - name: Restore Vite build cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite
          key:  vite-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.*') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Verify dist output
        # Confirm the entry point was emitted — guards against silent Vite failures
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html not found — build may have silently failed."
            exit 1
          fi
          echo "✓ dist/index.html present"
          du -sh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name:            dist-${{ github.sha }}
          path:            dist/
          retention-days:  7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Android Unit Tests (JVM / JUnit + Robolectric)
#
#   NEDEN VAR (denetim 2026-08-21, kütük V-01):
#     Depoda 25 Java test sınıfı / 335 test YAZILI ama HİÇBİR workflow gradle
#     çağırmıyordu. `codeql.yml` yalnız javascript-typescript tarıyor; JOB 2'deki
#     `reporter: java-junit` bir RAPOR BİÇİMİ adıdır, Java testi değildir. Yani
#     27 820 satır native Java — kilit/korna/alarm komutlarını MCU'ya seri porttan
#     gönderen katman — otomatik kapı olmadan sürüm alıyordu.
#
#   NEDEN PARALEL (needs: yok):
#     Java doğruluğu TypeScript lint'ine bağlı değildir. Seri zincire eklemek,
#     bir ESLint uyarısının native regresyonu GİZLEMESİ demekti. İki zincir
#     bağımsız koşar; "CI" durumu ikisinin de yeşil olmasını ister.
#
#   CI'DA KIRILAN ÜÇ GİZLİ BAĞIMLILIK (ölçüldü, hepsi bu job'da karşılandı):
#     1. `capacitor-cordova-android-plugins/` .gitignore'ludur (android/.gitignore)
#        ama settings.gradle onu `include` eder → taze checkout'ta KONFİGÜRASYON
#        DÜŞER. Çözüm: `npx cap update android` (dist/ GEREKTİRMEZ — ölçüldü).
#     2. `android/gradlew` git'te 100644'tü → Linux'ta "permission denied".
#        Kalıcı çözüm depoda (100755); buradaki `chmod +x` savunma derinliğidir.
#     3. Root build.gradle `buildDir`i C:/Temp'e taşıyordu → Linux'ta proje
#        altında "C:" adlı klasör. Artık OS-koşullu (bkz. android/build.gradle).
#
#   NDK KURULMAZ — BİLİNÇLİ: yerel koşumda görev grafiği 49 görevdi ve içinde
#   TEK BİR cmake/externalNativeBuild/jniLib görevi YOKTU. `testDebugUnitTest`
#   native derlemeye dokunmaz → ~1 GB indirme ve dakikalar tasarruf edilir.
#   Bu varsayım yanlışsa job KIRMIZI olur ve nedenini adıyla söyler (sessiz
#   geçmez); o durumda `packages:` satırına `ndk;26.3.11579264` eklenir.
# ─────────────────────────────────────────────────────────────────────────────
  android_unit_tests:
    name: Android Unit Tests (JVM)
    runs-on: ubuntu-latest

    permissions:
      checks: write          # test-reporter Check annotation'ları için
      pull-requests: write   # PR özet yorumu için

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        # Capacitor plugin modülleri Java 21 toolchain ister
        # (app/capacitor.build.gradle → sourceCompatibility VERSION_21).
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node ${{ env.NODE_VERSION }}
        # Gradle, node_modules/@capacitor/*/android altındaki modülleri
        # `capacitor.settings.gradle` üzerinden include eder → Node şart.
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Capacitor önkoşulları — assets dizini + webDir stub
        # ⚠️ İKİSİ DE ZORUNLU. Taze checkout'ta ölçüldü (git worktree ile birebir
        # simüle edildi); ilk yazımda İKİSİ DE eksikti ve bu job ilk koşumda
        # kırmızı olacaktı:
        #
        #   1) `android/app/src/main/assets/` HİÇ OLUŞMUYOR — .gitignore altındaki
        #      üç girdi (public/ · capacitor.config.json · capacitor.plugins.json)
        #      yüzünden dizinde tek bir takipli dosya yok, git de boş dizin yaratmaz.
        #      `cap update` oraya YAZMAYA çalışıp patlıyor:
        #        ENOENT … open '…/assets/capacitor.plugins.json'
        #      `cap update` bu dizini KENDİ OLUŞTURMUYOR (ayrıca ölçüldü).
        #
        #   2) `dist/` de ŞART, ama SEBEBİ "update her zaman copy çalıştırır" DEĞİL.
        #      Mekanizma kaynaktan okundu — @capacitor/cli/dist/android/update.js:31:
        #        if (!(await pathExists(config.android.webDirAbs))) { await copy(...) }
        #      Yani `cap update` copy'ye YALNIZCA `android/app/src/main/assets/public`
        #      YOKKEN düşer. Taze checkout'ta o dizin gitignore'lu olduğu için yok →
        #      copy çağrılır → "Could not find the web assets directory: ./dist".
        #      DİKKAT: iki ölçüm turunda iki YANLIŞ gerekçe üretildi — önce "update
        #      dist/ istemez" (ana ağaçta dist/ VARDI: ölçüm değil artefakt), sonra
        #      "update koşulsuz copy çalıştırır" (kaynak desteklemiyor). Doğrusu KOŞULLU.
        #
        # STUB BİLİNÇLİ: bu job JVM birim testleri koşar, web varlığı OKUMAZ.
        # Tam `npm run build` yalnız Capacitor'ın ön koşulunu susturmak için
        # dakikalar harcardı (JOB 3 zaten gerçek build'i doğruluyor). Stub'ın
        # assets/public'e kopyalanması Robolectric için zararsızdır.
        # DİKKAT: bu adım web varlıklarını DOĞRULAMAZ — öyle okunmamalı.
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p dist
          [ -f dist/index.html ] || printf '<!doctype html><title>ci-jvm-test-stub</title>' > dist/index.html

      - name: Capacitor — native modülleri üret
        # `capacitor-cordova-android-plugins/` .gitignore'ludur ama settings.gradle
        # onu include eder → bu adım olmadan taze checkout'ta gradle KONFİGÜRASYONU
        # düşer: "Could not read script '…/capacitor-cordova-android-plugins/
        # cordova.variables.gradle' as it does not exist." (worktree'de ölçüldü).
        run: npx cap update android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew çalıştırılabilir olsun
        run: chmod +x android/gradlew

      - name: Gradle — JVM unit tests
        # :app                → 20 sınıf (OBD/ELM · KWP · MCU whitelist · Phone Hub · media)
        # :phonehub-protocol  →  5 sınıf (frame codec · session crypto · handshake · diagnostics)
        # :phonehub-companion → test kaynağı YOK (bilinçli: saf Android companion)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :phonehub-protocol:test --console=plain --stacktrace

      - name: Verify automotive-critical Java suites ran
        # JS tarafındaki aynı kapı deseni: bir suite sessizce düşerse/atlanırsa
        # XML'de sınıfı bulunmaz → build BLOKE. "0 test koştu" da başarı SAYILMAZ.
        if: always()
        shell: bash
        run: |
          shopt -s globstar nullglob
          xmls=(android/**/build/test-results/**/TEST-*.xml)
          if [ ${#xmls[@]} -eq 0 ]; then
            echo "::error::Java JUnit XML üretilmedi — gradle test görevi hiç koşmamış olabilir. Build blocked."
            exit 1
          fi

          for suite in "McuCommandWhitelistTest" "ElmProtocolTest" "BootReceiverActionGateTest" "SessionCryptoTest"; do
            if ! grep -qh "classname=\"[^\"]*${suite}\"" "${xmls[@]}"; then
              echo "::error::Automotive critical Java suite '${suite}' not found in JUnit reports. Build blocked."
              exit 1
            fi
          done
          echo "✓ Automotive critical Java suites confirmed: McuCommandWhitelist, ElmProtocol, BootReceiverActionGate, SessionCrypto"

          # Toplam sayım `awk` ile — `bc` her ortamda YOK ve eksikse sayaç
          # SESSİZCE boş kalıp adım yeşil geçiyordu (ölçüldü). Sıfır test de
          # başarı SAYILMAZ: suite dosyası var ama içi boşalmışsa burada düşer.
          total=$(grep -ho 'tests="[0-9]*"' "${xmls[@]}" \
                  | grep -o '[0-9]*' \
                  | awk '{ s += $1 } END { print s + 0 }')
          if [ "${total}" -le 0 ]; then
            echo "::error::Java JUnit raporlarında 0 test var — suite'ler boşalmış olabilir. Build blocked."
            exit 1
          fi
          echo "✓ Java test sınıfı: ${#xmls[@]} · toplam test: ${total}"

      - name: Publish Android test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name:              Android Unit Test Results
          path:              android/**/build/test-results/**/TEST-*.xml
          reporter:          java-junit
          fail-on-error:     true
          fail-on-empty:     true

      - name: Upload Android JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:            android-test-results-${{ github.run_number }}
          path:            android/**/build/test-results/**/TEST-*.xml
          retention-days:  30
